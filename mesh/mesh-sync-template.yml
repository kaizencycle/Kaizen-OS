# Mobius Neural Substrate — Mesh Sync
# Copy to .github/workflows/mesh-sync.yml in any repo joining the MNS.
# Requires: MOBIUS_MESH_TOKEN secret (issued by stewards).

name: MNS Mesh Sync

on:
  push:
    branches: [main]

jobs:
  mesh-sync:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Parse mobius.yaml and build EPICON entry
        id: epicon
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_SHA="${{ github.sha }}"
          AUTHOR="${{ github.event.head_commit.author.name }}"
          TIMESTAMP="${{ github.event.head_commit.timestamp }}"
          NODE_ID=$(grep 'node_id:' mobius.yaml | head -1 | awk '{print $2}' | tr -d '"' || echo "unknown")

          cat > /tmp/epicon-entry.json << EOF
          {
            "id": "EPICON-MNS-${COMMIT_SHA:0:8}",
            "node_id": "${NODE_ID}",
            "timestamp": "${TIMESTAMP}",
            "author": "${AUTHOR}",
            "sha": "${COMMIT_SHA}",
            "title": "$(echo "$COMMIT_MSG" | head -1 | sed 's/"/\\"/g')",
            "source": "mesh-node",
            "type": "mesh-commit",
            "verified": false
          }
          EOF

      - name: Update local ledger feed
        run: |
          mkdir -p ledger
          if [ ! -f ledger/feed.json ]; then echo "[]" > ledger/feed.json; fi
          node <<'NODE'
          const fs = require('fs');
          const feed = JSON.parse(fs.readFileSync('ledger/feed.json', 'utf8'));
          const entry = JSON.parse(fs.readFileSync('/tmp/epicon-entry.json', 'utf8'));
          if (!Array.isArray(feed)) throw new Error('ledger/feed.json must be a JSON array');
          feed.unshift(entry);
          if (feed.length > 100) feed.splice(100);
          fs.writeFileSync('ledger/feed.json', JSON.stringify(feed, null, 2));
          NODE

      - name: Push to Substrate mesh endpoint
        env:
          MOBIUS_MESH_TOKEN: ${{ secrets.MOBIUS_MESH_TOKEN }}
        run: |
          if [ -z "${MOBIUS_MESH_TOKEN:-}" ]; then
            echo "MOBIUS_MESH_TOKEN not set — skipping ingest (observer mode)"
            exit 0
          fi
          NODE_ID=$(grep 'node_id:' mobius.yaml | head -1 | awk '{print $2}' | tr -d '"' || echo "unknown")
          curl -sf -X POST \
            https://civic-protocol-core-ledger.onrender.com/mesh/ingest \
            -H "Authorization: Bearer ${MOBIUS_MESH_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "X-MNS-Node: ${NODE_ID}" \
            -d @ledger/feed.json \
            || echo "Mesh push failed — continuing"

      - name: Commit ledger update
        run: |
          git config user.name "mobius-bot"
          git config user.email "bot@mobius.substrate"
          git add ledger/feed.json
          if git diff --staged --quiet; then
            echo "No ledger changes"
            exit 0
          fi
          git commit -m "chore(ledger): mesh sync [skip ci]"
          git push
