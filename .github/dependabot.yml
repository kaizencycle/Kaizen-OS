# C-339: automated dependency update flow.
# security-audit.yml only *reports* (npm audit, daily); nothing previously
# opened update PRs. Dependabot closes that loop for both ecosystems.
# Update PRs pass through the same merge gate as everything else —
# consensus:approved + sentinel review on head SHA.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # Security updates always; version bumps grouped to limit PR noise
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Hold ESLint at 8.x. ESLint 9+ requires flat config AND downstream
      # support that does not exist for this toolchain: `eslint-config-next`
      # (used by 55+ apps via `next lint`) has NO release that supports
      # ESLint 10 (peer caps at ^9, and only from eslint-config-next@15),
      # and the repo's @typescript-eslint@6 caps at ESLint 8. Bumping ESLint
      # to 9/10 breaks `next lint` fleet-wide with no upstream fix. Revisit
      # after Next.js is upgraded and eslint-config-next ships ESLint 10
      # support. Tracked by the closure of #304.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      # C-339 dependabot consolidation (supersedes #311-#314): hold majors
      # that are migration projects, not dependency bumps.
      #
      # Tailwind 4 rewrote the config system (CSS-first, new PostCSS plugin);
      # 8 apps pin ^3.4.x with tailwind.config.js. Migrate deliberately.
      - dependency-name: "tailwindcss"
        update-types:
          - "version-update:semver-major"
      # http-proxy-middleware v3+ changed the createProxyMiddleware API
      # (context/pathRewrite semantics); apps/api-gateway uses the v2 API.
      - dependency-name: "http-proxy-middleware"
        update-types:
          - "version-update:semver-major"
      # hardhat-chai-matchers v3 requires hardhat v3; gic-registry-contracts
      # pins hardhat 2.22.5. Bump together with a hardhat 3 migration.
      - dependency-name: "@nomicfoundation/hardhat-chai-matchers"
        update-types:
          - "version-update:semver-major"
      # @types/node must track each workspace's runtime, not latest. Block
      # cross-major jumps (the #312 failure mode: 18->25) while letting
      # in-range maintenance flow — some workspaces legitimately declare ^22
      # (tokenomics-engine, sentinels/aurea) and still need 22.x patches.
      # Runtime upgrades are deliberate migrations, not dependabot bumps.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
