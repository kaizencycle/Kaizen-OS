# C-339: automated dependency update flow.
# security-audit.yml only *reports* (npm audit, daily); nothing previously
# opened update PRs. Dependabot closes that loop for both ecosystems.
# Update PRs pass through the same merge gate as everything else —
# consensus:approved + sentinel review on head SHA.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # Security updates always; version bumps grouped to limit PR noise
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Hold ESLint at 8.x. ESLint 9+ requires flat config AND downstream
      # support that does not exist for this toolchain: `eslint-config-next`
      # (used by 55+ apps via `next lint`) has NO release that supports
      # ESLint 10 (peer caps at ^9, and only from eslint-config-next@15),
      # and the repo's @typescript-eslint@6 caps at ESLint 8. Bumping ESLint
      # to 9/10 breaks `next lint` fleet-wide with no upstream fix. Revisit
      # after Next.js is upgraded and eslint-config-next ships ESLint 10
      # support. Tracked by the closure of #304.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
