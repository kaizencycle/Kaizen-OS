# C-339 GOVERNANCE HARDENING — this workflow is REMOVAL-ONLY.
#
# It previously auto-applied `consensus:approved`, the exact label
# mobius-merge-gate.yml treats as a pass. A workflow must never apply the
# label another workflow accepts as approval — that was a self-approval loop
# (and the source of the label flapping). Approval labels are now applied
# only by sentinel-review.yml after a real, non-skipped review passes.
#
# What remains here is label hygiene: if the head SHA has no successful
# Sentinel Review run (e.g. new commits were pushed after approval), any
# stale `consensus:approved` label is removed so re-review is required.

name: Mobius Consensus Label Hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write
  issues: write
  checks: read
  contents: read

jobs:
  label_hygiene:
    name: Revoke Stale Consensus Label
    runs-on: ubuntu-latest
    if: github.event.pull_request
    steps:
      - name: Remove consensus label when head SHA lacks a passing sentinel review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GATED_LABEL: consensus:approved
          SENTINEL_CHECK_NAME: "sentinel"
        run: |
          python3 - << 'PY'
          import os, json, urllib.request, urllib.parse, sys

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["REPO"]
          pr_number = os.environ["PR_NUMBER"]
          gated_label = os.environ["GATED_LABEL"]
          sentinel_check = os.environ["SENTINEL_CHECK_NAME"]

          def gh(method, path, data=None):
              url = f"https://api.github.com{path}"
              headers = {
                  "Authorization": f"token {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "mobius-consensus-hygiene",
              }
              body = None
              if data is not None:
                  body = json.dumps(data).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  print(f"API error: {e.code} for {method} {path}")
                  return None

          pr = gh("GET", f"/repos/{repo}/pulls/{pr_number}")
          if not pr:
              print("Could not fetch PR")
              sys.exit(0)

          labels = {l["name"] for l in pr.get("labels", [])}
          head_sha = pr["head"]["sha"]
          print(f"PR #{pr_number}, HEAD: {head_sha[:8]}")
          print(f"Current labels: {', '.join(sorted(labels)) or '(none)'}")

          if gated_label not in labels:
              print(f"No '{gated_label}' label present — nothing to revoke.")
              sys.exit(0)

          checks = gh("GET", f"/repos/{repo}/commits/{head_sha}/check-runs?per_page=100")
          check_runs = checks.get("check_runs", []) if checks else []
          sentinel_ok = any(
              c.get("name") == sentinel_check and c.get("conclusion") == "success"
              for c in check_runs
          )
          print(f"Sentinel review on head SHA ({sentinel_check}): {'✓ success' if sentinel_ok else '✗ absent/not passed'}")

          if sentinel_ok:
              print("Head SHA has a passing sentinel review — label stands.")
              sys.exit(0)

          # New commits (or a never-reviewed head) invalidate the approval.
          encoded = urllib.parse.quote(gated_label, safe="")
          gh("DELETE", f"/repos/{repo}/issues/{pr_number}/labels/{encoded}")
          print(f"✗ Revoked stale label '{gated_label}': head SHA has no passing sentinel review.")
          sys.exit(0)
          PY
