name: mobius-operator-merge

# C-303: fixed core.getInput('pr_number') → process.env.PR_NUMBER
# core.getInput() reads action inputs, not workflow inputs — always returned empty,
# causing the status check to fail on every invocation.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR to merge after consensus"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check required statuses
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        with:
          script: |
            const pr = parseInt(process.env.PR_NUMBER);
            if (!pr || isNaN(pr)) {
              core.setFailed(`Invalid PR number: "${process.env.PR_NUMBER}"`);
              return;
            }

            const { data: prData } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr
            });
            const sha = prData.head.sha;

            const { data: statuses } = await github.rest.repos.getCombinedStatusForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha
            });

            const required = ['mobius/consensus-gate', 'anti-nuke'];
            for (const r of required) {
              const ok = statuses.statuses.find(s => s.context === r && s.state === 'success');
              if (!ok) {
                core.setFailed(`Required status not green: ${r}`);
                return;
              }
            }

            core.setOutput('sha', sha);
            core.setOutput('pr', pr.toString());

      - name: Merge PR
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        with:
          script: |
            const pr = parseInt(process.env.PR_NUMBER);
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr,
              merge_method: 'squash'
            });
            core.info(`✅ PR #${pr} merged via squash`);
