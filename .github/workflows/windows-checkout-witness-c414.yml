# Ephemeral ATLAS Job-5 witness — push-triggered on witness branch only.
# Not merged to main; does not expand permanent CI on default branch.
name: C-414 Windows Checkout Witness (Job-5)

on:
  push:
    branches:
      - cursor/c414-windows-checkout-witness-0e02
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to witness (default main)
        required: false
        default: main

permissions:
  contents: read

jobs:
  windows-checkout-witness:
    name: windows-latest conventional checkout
    runs-on: windows-latest
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}
          fetch-depth: 1

      - name: Record witness context
        shell: bash
        run: |
          echo "WITNESS_REF=${{ github.event.inputs.ref || 'main' }}"
          echo "WITNESS_SHA=$(git rev-parse HEAD)"
          echo "RUNNER_OS=${RUNNER_OS}"
          git --version

      - name: Assert top-level ... absent from index
        shell: bash
        run: |
          if git ls-tree --name-only HEAD | grep -Fx '...'; then
            echo "FAIL: top-level '...' still in HEAD tree" >&2
            exit 1
          fi

      - name: Assert top-level ... not materialized on disk
        shell: bash
        run: |
          if [[ -e './...' ]]; then
            echo "FAIL: top-level '...' exists on Windows filesystem" >&2
            exit 1
          fi
          if find . -maxdepth 1 -name '...' -print -quit | grep -q .; then
            echo "FAIL: find detected top-level '...'" >&2
            exit 1
          fi

      - name: Assert working tree clean after checkout
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "FAIL: working tree not clean after checkout" >&2
            git status --porcelain >&2
            exit 1
          fi

      - name: Repository discovery commands
        shell: bash
        run: |
          git rev-parse HEAD
          git ls-tree --name-only HEAD | head -20
          test -f cycle.json
          test -f package.json
          test -f scripts/verify_windows_portable_checkout.sh

      - name: Portable checkout shell guard (authoritative on Windows)
        shell: bash
        run: bash scripts/verify_windows_portable_checkout.sh

      - name: Path safety unit tests (informational; Path(...).exists false-positive on Windows)
        shell: bash
        run: |
          python -m unittest tests.test_windows_portable_paths.TestWindowsPortablePaths.test_root_tree_has_no_windows_invalid_ellipsis_path -v
          python - <<'PY'
          import os, subprocess, sys, tempfile
          from pathlib import Path
          tmp = tempfile.mkdtemp(prefix="mobius-win-clone-")
          clone = Path(tmp) / "clone"
          subprocess.check_call(["git", "clone", "--quiet", ".", str(clone)], cwd=os.getcwd())
          status = subprocess.check_output(["git", "status", "--porcelain"], cwd=clone, text=True).strip()
          if status:
              print("FAIL: clone not clean:", status, file=sys.stderr)
              sys.exit(1)
          # Windows-safe: directory listing, not Path('...').exists()
          names = os.listdir(clone)
          if "..." in names:
              print("FAIL: clone materialized top-level ...", file=sys.stderr)
              sys.exit(1)
          print("PASS: Windows-safe fresh-clone check")
          PY

      - name: Witness pass marker
        shell: bash
        run: echo "WITNESS_PASS windows-latest conventional checkout"
