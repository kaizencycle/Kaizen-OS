# .github/workflows/sentinel-review.yml
#
# C-339 GOVERNANCE HARDENING — this check FAILS CLOSED on unrequested review.
# C-373 PHASE 0 — verdict ontology (see docs/WITNESS_PROTOCOL.md, HANDOFF_C-373_oaa-sentinel-review-broker.md):
#   - Unrequested review (no label)     -> check FAILS (C-339; never vacuously pass).
#   - FAIL   = review ran with blocking -> check FAILS.
#   - SKIPPED = review could not run (missing key, vendor 4xx/5xx, OAA broker unreachable)
#               -> check does NOT fail; comment shows loud SKIPPED block.
#   - Invalid model JSON output         -> FAIL (genuine review failure, not SKIPPED).
#   - consensus:approved                -> output only when ALL requested sentinels PASS
#                                         (any SKIPPED -> no label).
#
# C-373 PHASE 1 — OAA broker path (default):
#   CI holds MOBIUS_CI_SENTINEL_HMAC_KEY only; vendor keys relocate to broker Render env.
#   Broker script is pinned to pull_request.base.sha (not PR head) before secrets load.
#   Secrets are step-scoped — never job-level — so PR-controlled steps cannot read them.
#   Set SENTINEL_DIRECT_FALLBACK=true to restore direct vendor calls (counterfactual escape hatch).
#
# REQUIRED SECRETS (Phase 1 default — broker path):
#   MOBIUS_CI_SENTINEL_HMAC_KEY — HMAC for x-oaa-agent: mobius-ci-sentinel
#
# OPTIONAL (SENTINEL_DIRECT_FALLBACK=true only):
#   OPENAI_API_KEY     — AUREA review (and ATLAS fallback)
#   ANTHROPIC_API_KEY  — ATLAS review (preferred)
#
# REPO VARIABLES (Settings -> Secrets and variables -> Actions -> Variables):
#   OPENAI_MODEL       — default gpt-4o-mini
#   ANTHROPIC_MODEL    — default claude-sonnet-4-20250514 (replaces retired claude-3-5-sonnet-20241022)
#
# To request review, label the PR: review:aurea, review:atlas, or
# consensus:requested (runs both).
name: Sentinel Review (AUREA + ATLAS)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: sentinel-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sentinel:
    runs-on: ubuntu-latest
    env:
      OAA_BROKER_URL: ${{ vars.OAA_BROKER_URL != '' && vars.OAA_BROKER_URL || 'https://oaa-api-library.onrender.com/v1/sentinel/review' }}
      OAA_AGENT_ID: mobius-ci-sentinel
      SENTINEL_DIRECT_FALLBACK: ${{ vars.SENTINEL_DIRECT_FALLBACK != '' && vars.SENTINEL_DIRECT_FALLBACK || 'false' }}

      OPENAI_MODEL: ${{ vars.OPENAI_MODEL != '' && vars.OPENAI_MODEL || 'gpt-4o-mini' }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL != '' && vars.ANTHROPIC_MODEL || 'claude-sonnet-4-20250514' }}

      MAX_DIFF_CHARS: "120000"
      MAX_PROMPT_CHARS: "200000"

      # Hard requirements for "EPICON PR ready for merge"
      REQUIRE_EPICON: "true"
      REQUIRE_DOCS: "true"

      # Label behavior
      AUTO_LABEL_ON_PASS: "true"
      PASS_LABEL: "consensus:approved"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gate (only run when requested)
        id: gate
        uses: actions/github-script@v9
        with:
          script: |
            const labels = (context.payload.pull_request.labels || []).map(l => l.name);
            // C-339: consensus:approved removed from the run set — approval is an
            // output of this workflow, never a trigger for it. Re-checks use
            // consensus:requested.
            const run =
              labels.includes('review:aurea') ||
              labels.includes('review:atlas') ||
              labels.includes('consensus:requested');
            core.setOutput('run', run ? 'true' : 'false');
            core.setOutput('labels', labels.join(', '));

      - name: Fail closed (no sentinel labels)
        if: steps.gate.outputs.run != 'true'
        run: |
          # C-339: a review that was never requested is not a passed review.
          echo "::error::Sentinel review not requested. Add label review:aurea, review:atlas, or consensus:requested. This check fails closed until a review runs."
          exit 1

      - name: Build PR context + diff (truncated) + file list
        id: ctx
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --prune --depth=200 origin "${BASE}" "${HEAD}" || true

          git diff --name-only "${BASE}" "${HEAD}" > /tmp/changed_files.txt || true
          git diff --unified=3 "${BASE}" "${HEAD}" > /tmp/pr.diff || true

          python3 - <<'PY'
          import os
          max_chars = int(os.environ.get("MAX_DIFF_CHARS","120000"))
          path = "/tmp/pr.diff"
          try:
            with open(path,"r",encoding="utf-8",errors="ignore") as f:
              s = f.read()
          except FileNotFoundError:
            s = ""
          if len(s) > max_chars:
            s = s[:max_chars] + "\n\n[DIFF TRUNCATED]\n"
          with open(path,"w",encoding="utf-8") as f:
            f.write(s)
          print(f"diff_chars={len(s)}")
          PY

          python3 - <<'PY'
          import json, os
          pr = {
            "number": int(os.environ["PR_NUMBER"]),
            "title": os.environ.get("PR_TITLE",""),
            "body": os.environ.get("PR_BODY",""),
            "url": os.environ.get("PR_URL",""),
            "head": os.environ.get("PR_HEAD",""),
            "base": os.environ.get("PR_BASE",""),
            "labels": os.environ.get("PR_LABELS",""),
            "author": os.environ.get("PR_AUTHOR",""),
          }
          with open("/tmp/pr.meta.json","w",encoding="utf-8") as f:
            json.dump(pr,f,ensure_ascii=False,indent=2)
          PY
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_LABELS: ${{ steps.gate.outputs.labels }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}

      - name: Resolve sentinel model IDs (C-373 Phase 0)
        if: steps.gate.outputs.run == 'true'
        run: |
          echo "::notice title=Sentinel models::OPENAI_MODEL=${OPENAI_MODEL} ANTHROPIC_MODEL=${ANTHROPIC_MODEL}"
          echo "::notice::Anthropic default claude-sonnet-4-20250514 replaces retired claude-3-5-sonnet-20241022 (PR #387 vendor HTTP 400). Override via repo vars."

      - name: Resolve requested sentinels
        id: sentinels
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          labels="${{ steps.gate.outputs.labels }}"
          list=()
          if [[ "$labels" == *"review:aurea"* ]] || [[ "$labels" == *"consensus:requested"* ]]; then
            list+=("aurea")
          fi
          if [[ "$labels" == *"review:atlas"* ]] || [[ "$labels" == *"consensus:requested"* ]]; then
            list+=("atlas")
          fi
          joined=$(IFS=,; echo "${list[*]}")
          echo "list=${joined}" >> "$GITHUB_OUTPUT"
          echo "Requested sentinels: ${joined}"

      - name: Enforce EPICON/Docs presence (hard rules)
        id: hardrules
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          req_epicon = os.environ.get("REQUIRE_EPICON","true").lower() == "true"
          req_docs   = os.environ.get("REQUIRE_DOCS","true").lower() == "true"

          with open("/tmp/changed_files.txt","r",encoding="utf-8",errors="ignore") as f:
            files = [ln.strip() for ln in f.readlines() if ln.strip()]

          # Check for EPICON files in docs/epicon/ (repo structure)
          epicon_ok = True if not req_epicon else any(
            (f.startswith("docs/epicon/") or f.startswith("epicon/")) and (f.endswith(".md") or f.endswith(".json")) for f in files
          )
          # Check for docs/*.md files
          docs_ok = True if not req_docs else any(
            f.startswith("docs/") and f.endswith(".md") for f in files
          )

          # Optionally: require PR template checkbox text in PR body
          pr_body = ""
          try:
            import json
            pr_body = json.load(open("/tmp/pr.meta.json","r",encoding="utf-8")).get("body","") or ""
          except Exception:
            pass

          # Simple EPICON declaration checkbox (optional pattern)
          # e.g., "- [x] EPICON attached"
          declared = bool(re.search(r"\-\s*\[x\]\s*EPICON", pr_body, re.IGNORECASE))

          print(f"epicon_ok={epicon_ok}")
          print(f"docs_ok={docs_ok}")
          print(f"declared_ok={declared}")
          print(f"files_changed={len(files)}")

          if not epicon_ok:
            raise SystemExit("HARD FAIL: REQUIRE_EPICON=true but no docs/epicon/* file changed.")
          if not docs_ok:
            raise SystemExit("HARD FAIL: REQUIRE_DOCS=true but no docs/*.md file changed.")
          # We won't hard-fail on checkbox declaration; it's advisory.
          PY

      - name: Run OAA sentinel broker (C-373 Phase 1)
        id: oaa
        if: steps.gate.outputs.run == 'true' && env.SENTINEL_DIRECT_FALLBACK != 'true'
        shell: bash
        env:
          MOBIUS_CI_SENTINEL_HMAC_KEY: ${{ secrets.MOBIUS_CI_SENTINEL_HMAC_KEY }}
          SENTINELS: ${{ steps.sentinels.outputs.list }}
          SENTINEL_VERDICTS_PATH: /tmp/oaa_verdicts.json
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          SCRIPT_PATH="/tmp/build_oaa_sentinel_request_pinned.py"
          if git cat-file -e "${BASE_SHA}:scripts/build_oaa_sentinel_request.py" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/build_oaa_sentinel_request.py" > "${SCRIPT_PATH}"
            echo "::notice::Broker script pinned to base ${BASE_SHA:0:7} (PR head copy not executed with secrets)"
          else
            echo "::warning::Broker script absent on base — bootstrap uses workspace copy until merge"
            cp scripts/build_oaa_sentinel_request.py "${SCRIPT_PATH}"
          fi
          python3 "${SCRIPT_PATH}"
          python3 - <<'PY'
          import json, os
          path = os.environ.get("SENTINEL_VERDICTS_PATH", "/tmp/oaa_verdicts.json")
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as fh:
              fh.write(f"aurea_json={json.dumps(data.get('aurea', {}))}\n")
              fh.write(f"atlas_json={json.dumps(data.get('atlas', {}))}\n")
          PY

      - name: Run AUREA review (OpenAI) -> JSON verdict
        id: aurea
        if: env.SENTINEL_DIRECT_FALLBACK == 'true' && (contains(steps.gate.outputs.labels, 'review:aurea') || contains(steps.gate.outputs.labels, 'consensus:requested'))
        uses: actions/github-script@v9
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          script: |
            const fs = require('fs');

            const apiKey = process.env.OPENAI_API_KEY;
            if (!apiKey) {
              core.warning('OPENAI_API_KEY secret is not configured; AUREA review SKIPPED (C-373 — vendor absence is not a review verdict).');
              core.setOutput('json', JSON.stringify({
                verdict: 'skipped',
                skip_reason: 'OPENAI_API_KEY not configured',
                blocking: [],
                non_blocking: [],
                summary: 'AUREA review skipped — API key absent.',
              }));
              return;
            }

            const meta = fs.readFileSync('/tmp/pr.meta.json','utf8');
            const diff = fs.readFileSync('/tmp/pr.diff','utf8');
            const files = fs.readFileSync('/tmp/changed_files.txt','utf8');

            const instruction = `
            Return ONLY valid JSON (no markdown, no prose) with schema:
            {
              "verdict": "pass" | "fail",
              "summary": "string (<=400 chars)",
              "blocking": ["..."],
              "non_blocking": ["..."],
              "epicon_checks": {
                 "epicon_present": true|false,
                 "docs_present": true|false,
                 "notes": ["..."]
              }
            }

            Rules:
            - "blocking" MUST include any missing EPICON/docs requirements you detect.
            - Only mark "fail" if there is at least one blocking item.
            - Be concrete: cite file paths when possible.
            `;

            const content =
            `# AUREA Sentinel Review
            ## PR Meta
            ${meta}

            ## Changed files
            ${files}

            ## Diff (truncated)
            ${diff}

            ${instruction}
            `;

            const maxPrompt = parseInt(process.env.MAX_PROMPT_CHARS || '200000', 10);
            const finalContent = content.length > maxPrompt ? (content.slice(0, maxPrompt) + '\n\n[CONTENT TRUNCATED]\n') : content;

            const model = process.env.OPENAI_MODEL || 'gpt-4o-mini';

            const res = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model,
                temperature: 0.1,
                messages: [
                  { role: 'system', content: 'You are AUREA, an integrity reviewer. Return STRICT JSON only.' },
                  { role: 'user', content: finalContent }
                ]
              })
            });

            if (!res.ok) {
              const err = await res.text();
              core.warning(`AUREA vendor transport error HTTP ${res.status} — SKIPPED (not FAIL).`);
              core.setOutput('json', JSON.stringify({
                verdict: 'skipped',
                skip_reason: `OpenAI HTTP ${res.status}`,
                blocking: [],
                non_blocking: [],
                summary: 'AUREA request failed at vendor transport layer.',
                raw: err.slice(0, 1200),
              }));
              return;
            }

            const data = await res.json();
            const text = data?.choices?.[0]?.message?.content ?? '';
            // best-effort parse; if parse fails, fail closed
            try {
              // Handle potential markdown code blocks around JSON
              let jsonText = text.trim();
              if (jsonText.startsWith('```json')) {
                jsonText = jsonText.slice(7);
              } else if (jsonText.startsWith('```')) {
                jsonText = jsonText.slice(3);
              }
              if (jsonText.endsWith('```')) {
                jsonText = jsonText.slice(0, -3);
              }
              const parsed = JSON.parse(jsonText.trim());
              core.setOutput('json', JSON.stringify(parsed));
            } catch (e) {
              core.setOutput('json', JSON.stringify({
                verdict: 'fail',
                blocking: ['AUREA output was not valid JSON'],
                non_blocking: [],
                summary: 'Parsing failed — model returned non-JSON (review failure, not SKIPPED).',
                raw: text.slice(0, 1200),
              }));
            }

      - name: Run ATLAS review (Anthropic preferred) -> JSON verdict
        id: atlas
        if: env.SENTINEL_DIRECT_FALLBACK == 'true' && (contains(steps.gate.outputs.labels, 'review:atlas') || contains(steps.gate.outputs.labels, 'consensus:requested'))
        uses: actions/github-script@v9
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          script: |
            const fs = require('fs');

            const meta = fs.readFileSync('/tmp/pr.meta.json','utf8');
            const diff = fs.readFileSync('/tmp/pr.diff','utf8');
            const files = fs.readFileSync('/tmp/changed_files.txt','utf8');

            const instruction = `
            Return ONLY valid JSON (no markdown, no prose) with schema:
            {
              "verdict": "pass" | "fail",
              "summary": "string (<=400 chars)",
              "blocking": ["..."],
              "non_blocking": ["..."],
              "epicon_checks": {
                 "epicon_present": true|false,
                 "docs_present": true|false,
                 "notes": ["..."]
              }
            }

            Rules:
            - "blocking" MUST include any missing EPICON/docs requirements you detect.
            - Only mark "fail" if there is at least one blocking item.
            - Look for falsifiability gaps, arbitrary thresholds, and compliance-theater risk.
            - Be concrete: cite file paths when possible.
            `;

            const content =
            `# ATLAS Sentinel Review
            ## PR Meta
            ${meta}

            ## Changed files
            ${files}

            ## Diff (truncated)
            ${diff}

            ${instruction}
            `;

            const maxPrompt = parseInt(process.env.MAX_PROMPT_CHARS || '200000', 10);
            const finalContent = content.length > maxPrompt ? (content.slice(0, maxPrompt) + '\n\n[CONTENT TRUNCATED]\n') : content;

            const anthropicKey = process.env.ANTHROPIC_API_KEY;
            if (anthropicKey) {
              const model = process.env.ANTHROPIC_MODEL || 'claude-sonnet-4-20250514';
              const res = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                  'x-api-key': anthropicKey,
                  'anthropic-version': '2023-06-01',
                  'content-type': 'application/json'
                },
                body: JSON.stringify({
                  model,
                  max_tokens: 1200,
                  temperature: 0.1,
                  system: 'You are ATLAS. Return STRICT JSON only.',
                  messages: [{ role: 'user', content: finalContent }]
                })
              });

              if (!res.ok) {
                const err = await res.text();
                core.warning(`ATLAS Anthropic transport error HTTP ${res.status} — SKIPPED (not FAIL).`);
                core.setOutput('json', JSON.stringify({
                  verdict: 'skipped',
                  skip_reason: `Anthropic HTTP ${res.status}`,
                  blocking: [],
                  non_blocking: [],
                  summary: 'ATLAS request failed at vendor transport layer.',
                  raw: err.slice(0, 1200),
                }));
                return;
              }

              const data = await res.json();
              const parts = data?.content || [];
              const text = parts.map(p => p.text || '').join('\n').trim();

              try {
                // Handle potential markdown code blocks around JSON
                let jsonText = text.trim();
                if (jsonText.startsWith('```json')) {
                  jsonText = jsonText.slice(7);
                } else if (jsonText.startsWith('```')) {
                  jsonText = jsonText.slice(3);
                }
                if (jsonText.endsWith('```')) {
                  jsonText = jsonText.slice(0, -3);
                }
                const parsed = JSON.parse(jsonText.trim());
                core.setOutput('json', JSON.stringify(parsed));
              } catch (e) {
                core.setOutput('json', JSON.stringify({
                  verdict: 'fail',
                  blocking: ['ATLAS output was not valid JSON'],
                  non_blocking: [],
                  summary: 'Parsing failed — model returned non-JSON (review failure, not SKIPPED).',
                  raw: text.slice(0, 1200),
                }));
              }
              return;
            }

            // Fallback to OpenAI if no Anthropic key
            const openaiKey = process.env.OPENAI_API_KEY;
            if (openaiKey) {
              const model = process.env.OPENAI_MODEL || 'gpt-4o-mini';
              const res = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${openaiKey}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  model,
                  temperature: 0.1,
                  messages: [
                    { role: 'system', content: 'You are ATLAS, a skeptical systems auditor. Return STRICT JSON only.' },
                    { role: 'user', content: finalContent }
                  ]
                })
              });

              if (!res.ok) {
                const err = await res.text();
                core.warning(`ATLAS OpenAI fallback transport error HTTP ${res.status} — SKIPPED (not FAIL).`);
                core.setOutput('json', JSON.stringify({
                  verdict: 'skipped',
                  skip_reason: `OpenAI HTTP ${res.status}`,
                  blocking: [],
                  non_blocking: [],
                  summary: 'ATLAS request failed at vendor transport layer (OpenAI fallback).',
                  raw: err.slice(0, 1200),
                }));
                return;
              }

              const data = await res.json();
              const text = data?.choices?.[0]?.message?.content ?? '';

              try {
                let jsonText = text.trim();
                if (jsonText.startsWith('```json')) {
                  jsonText = jsonText.slice(7);
                } else if (jsonText.startsWith('```')) {
                  jsonText = jsonText.slice(3);
                }
                if (jsonText.endsWith('```')) {
                  jsonText = jsonText.slice(0, -3);
                }
                const parsed = JSON.parse(jsonText.trim());
                core.setOutput('json', JSON.stringify(parsed));
              } catch (e) {
                core.setOutput('json', JSON.stringify({
                  verdict: 'fail',
                  blocking: ['ATLAS output was not valid JSON'],
                  non_blocking: [],
                  summary: 'Parsing failed — model returned non-JSON (review failure, not SKIPPED).',
                  raw: text.slice(0, 1200),
                }));
              }
              return;
            }

            core.warning('Neither ANTHROPIC_API_KEY nor OPENAI_API_KEY is configured; ATLAS review SKIPPED (C-373).');
            core.setOutput('json', JSON.stringify({
              verdict: 'skipped',
              skip_reason: 'No API keys configured',
              blocking: [],
              non_blocking: [],
              summary: 'ATLAS review skipped — configure ANTHROPIC_API_KEY or OPENAI_API_KEY.',
            }));

      - name: Render combined sentinel report + decide pass/fail
        id: decide
        uses: actions/github-script@v9
        env:
          AUREA_JSON: ${{ steps.oaa.outputs.aurea_json || steps.aurea.outputs.json || '{}' }}
          ATLAS_JSON: ${{ steps.oaa.outputs.atlas_json || steps.atlas.outputs.json || '{}' }}
        with:
          script: |
            const labels = `${{ steps.gate.outputs.labels }}` || '';
            const wantsAurea = labels.includes('review:aurea') || labels.includes('consensus:requested');
            const wantsAtlas = labels.includes('review:atlas') || labels.includes('consensus:requested');

            function parseVerdict(raw, sentinel, requested) {
              if (!requested) {
                return { state: 'not_requested', verdict: 'pass', summary: 'Not requested', blocking: [], non_blocking: [], skip_reason: null };
              }
              if (!raw || raw === '{}') {
                return {
                  state: 'skipped',
                  verdict: 'skipped',
                  summary: `${sentinel} review was requested but produced no output`,
                  blocking: [],
                  non_blocking: [],
                  skip_reason: 'No review output (check workflow logs)',
                };
              }
              let r;
              try { r = JSON.parse(raw); } catch (e) {
                return {
                  state: 'fail',
                  verdict: 'fail',
                  summary: `Failed to parse ${sentinel} output`,
                  blocking: [e.message],
                  non_blocking: [],
                  skip_reason: null,
                };
              }
              const verdict = String(r.verdict || 'fail').toLowerCase();
              const blocking = Array.isArray(r.blocking) ? r.blocking.filter(Boolean) : [];
              const non_blocking = Array.isArray(r.non_blocking) ? r.non_blocking : [];
              if (verdict === 'skipped') {
                return {
                  state: 'skipped',
                  verdict: 'skipped',
                  summary: r.summary || `${sentinel} review skipped`,
                  blocking: [],
                  non_blocking,
                  skip_reason: r.skip_reason || r.summary || 'Review could not run',
                };
              }
              if (verdict === 'pass' && blocking.length === 0) {
                return { state: 'pass', verdict: 'pass', summary: r.summary || '', blocking: [], non_blocking, skip_reason: null };
              }
              return {
                state: 'fail',
                verdict: 'fail',
                summary: r.summary || '',
                blocking: blocking.length ? blocking : [`${sentinel} review failed`],
                non_blocking,
                skip_reason: null,
              };
            }

            const A = parseVerdict(process.env.AUREA_JSON || '{}', 'AUREA', wantsAurea);
            const T = parseVerdict(process.env.ATLAS_JSON || '{}', 'ATLAS', wantsAtlas);

            const requested = [];
            if (wantsAurea) requested.push(A);
            if (wantsAtlas) requested.push(T);

            const failures = requested.filter((r) => r.state === 'fail');
            const skips = requested.filter((r) => r.state === 'skipped');
            const passes = requested.filter((r) => r.state === 'pass');

            const checkPass = failures.length === 0;
            const consensusEligible = requested.length > 0 && passes.length === requested.length;

            function renderSentinel(name, r) {
              if (r.state === 'not_requested') {
                return [`### ${name} — NOT REQUESTED`, r.summary ? `**Summary:** ${r.summary}` : '', ''].join('\n');
              }
              if (r.state === 'skipped') {
                return [
                  `### ${name} — ⚠️ SKIPPED`,
                  `**Reason:** ${r.skip_reason}`,
                  r.summary ? `**Summary:** ${r.summary}` : '',
                  '**Blocking:** none (vendor absence is not a review verdict)',
                  '',
                ].join('\n');
              }
              const icon = r.state === 'pass' ? '✅ PASS' : '❌ FAIL';
              return [
                `### ${name} — ${icon}`,
                r.summary ? `**Summary:** ${r.summary}` : '',
                r.blocking.length ? `**Blocking:**\n- ${r.blocking.join('\n- ')}` : '**Blocking:** none',
                r.non_blocking.length ? `**Non-blocking:**\n- ${r.non_blocking.join('\n- ')}` : '**Non-blocking:** none',
                '',
              ].join('\n');
            }

            const labelsDisplay = labels || '(none - add review:aurea, review:atlas, or consensus:requested)';
            let resultLine;
            if (!checkPass) {
              resultLine = `**Result:** ❌ FAIL (${failures.length} sentinel failure${failures.length !== 1 ? 's' : ''})`;
            } else if (skips.length > 0) {
              resultLine = `**Result:** ⚠️ CHECK PASSED WITH SKIPPED REVIEWS (${skips.length} skipped — no consensus:approved label)`;
            } else {
              resultLine = '**Result:** ✅ PASS';
            }

            const body = [
              '## 🤖 Sentinel Reviews (required check)',
              `**Labels:** \`${labelsDisplay}\``,
              '',
              resultLine,
              skips.length ? `> ⚠️ ${skips.length} sentinel review(s) could not run. Broker/vendor uptime is not merge authority (C-373 / WITNESS_PROTOCOL).` : '',
              '',
              '---',
              '',
              renderSentinel('AUREA', A),
              '---',
              '',
              renderSentinel('ATLAS', T),
              '---',
              '',
              '> Phase 1: configure `MOBIUS_CI_SENTINEL_HMAC_KEY` for OAA broker path. Direct vendor fallback: `SENTINEL_DIRECT_FALLBACK=true` + vendor secrets.',
            ].filter((x) => x !== null && x !== undefined).join('\n');

            const prNumber = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const marker = '## 🤖 Sentinel Reviews (required check)';
            const existing = comments.find((c) => c.user && c.user.type === 'Bot' && (c.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

            core.setOutput('pass', checkPass ? 'true' : 'false');
            core.setOutput('consensus_eligible', consensusEligible ? 'true' : 'false');
            core.setOutput('blocking_count', String(failures.reduce((n, f) => n + f.blocking.length, 0)));
            core.setOutput('skipped_count', String(skips.length));

      - name: Auto-label consensus:approved on pass
        if: steps.decide.outputs.consensus_eligible == 'true' && env.AUTO_LABEL_ON_PASS == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const label = process.env.PASS_LABEL || 'consensus:approved';
            const prNumber = context.payload.pull_request.number;
            
            // Check if label already exists
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });
            
            if (!labels.find(l => l.name === label)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: [label]
              });
            }

      - name: Fail the check if a requested sentinel returned FAIL
        if: steps.decide.outputs.pass != 'true'
        run: |
          echo "Sentinel review failed. Blocking failures: ${{ steps.decide.outputs.blocking_count }}; skipped: ${{ steps.decide.outputs.skipped_count }}"
          exit 1
