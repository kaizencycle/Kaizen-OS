# Substrate cortex — pulls ledger feeds from registered mesh nodes (MNS-v1).
# Merges into ledger/mesh-aggregate.json and ledger/network-mii.json.

name: MNS Mesh Aggregate

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mesh-aggregate
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch all node feeds
        run: node scripts/mesh-aggregate.mjs

      - name: Compute network MII
        run: node scripts/compute-network-mii.mjs

      - name: Commit aggregate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/mesh-aggregate.json ledger/network-mii.json
          if git diff --staged --quiet; then
            echo "No aggregate changes"
            exit 0
          fi
          git commit -m "chore(mesh): aggregate sync [skip ci]"
          git push
