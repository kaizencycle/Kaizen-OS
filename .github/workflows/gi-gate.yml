# MOBIUS-CLASS: integrity-gate
# OWNER: @kaizencycle
# INTRODUCED: C-148
# LAST-REVIEWED: C-292
# STATUS: active
# PURPOSE: Enforces Global Integrity (GI) baseline by reading live terminal snapshot.
# C-292: upgraded from KAIZEN_GI_BASELINE repo var (static 0.993) to live snapshot-lite fetch.

name: GI Gate (Integrity Threshold)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test --if-present

  gi-gate:
    runs-on: ubuntu-latest
    needs: [test]
    env:
      TERMINAL_URL: 'https://mobius-civic-ai-terminal.vercel.app'
      GI_MINIMUM: '0.60'

    steps:
      - uses: actions/checkout@v4

      - name: Fetch live GI from Terminal snapshot-lite
        id: gi
        run: |
          # C-292: read live GI from Terminal instead of static repo variable.
          # KAIZEN_GI_BASELINE was 0.993 — a constant that never failed the gate.
          SNAP=$(curl -sf --max-time 15 "${TERMINAL_URL}/api/terminal/snapshot-lite" 2>/dev/null || echo "")

          if [ -n "$SNAP" ]; then
            GI=$(echo "$SNAP" | python3 -c "import json,sys; d=json.load(sys.stdin); gi=d.get('gi') or d.get('integrity',{}).get('gi') or 0; print(round(float(gi),4))" 2>/dev/null || echo "0.65")
            SOURCE="terminal-snapshot-lite"
          else
            echo "::warning::Terminal snapshot-lite unreachable — using safe fallback 0.65"
            GI="0.65"
            SOURCE="fallback"
          fi

          echo "gi=$GI" >> $GITHUB_OUTPUT
          echo "source=$SOURCE" >> $GITHUB_OUTPUT
          echo "GI: $GI (source: $SOURCE)"

      - name: GI threshold gate
        env:
          GI_SCORE: ${{ steps.gi.outputs.gi }}
          GI_SOURCE: ${{ steps.gi.outputs.source }}
        run: |
          python3 - <<'PY'
          import os, sys

          gi      = float(os.environ.get('GI_SCORE', '0'))
          minimum = float(os.environ.get('GI_MINIMUM', '0.60'))
          source  = os.environ.get('GI_SOURCE', 'unknown')

          print(f"GI score:   {gi}  (source: {source})")
          print(f"GI minimum: {minimum}")
          print(f"GI mode:    {'green' if gi >= 0.85 else 'yellow' if gi >= 0.70 else 'red'}")

          if gi < minimum:
              print(f"::error::GI score ({gi}) is below minimum threshold ({minimum})")
              sys.exit(1)
          else:
              print(f"✅ GI gate passed ({gi} >= {minimum})")
          PY
