name: Mobius Divergence Dashboard

# C-303: staggered cron from "0 */6" to "10 */6" to avoid runner collision with
#        sentinel-heartbeat (0 */6) and mobius-sync-unified (5 */6).
#        Also added existence check for generate_divergence_dashboard.py.

on:
  workflow_dispatch:
  schedule:
    - cron: "10 */6 * * *"   # C-303: was "0 */6" — staggered +10m
  push:
    branches: [main]
    paths:
      - ".github/scripts/generate_divergence_dashboard.py"
      - ".github/workflows/mobius-divergence-dashboard.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    name: Generate Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check dashboard script exists
        id: script_check
        run: |
          if [ -f ".github/scripts/generate_divergence_dashboard.py" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::Dashboard script not found at .github/scripts/generate_divergence_dashboard.py — skipping."
          fi

      - name: Generate dashboard
        if: steps.script_check.outputs.exists == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OUT_DIR: docs/divergence
        run: |
          python .github/scripts/generate_divergence_dashboard.py

      - name: Commit dashboard
        if: steps.script_check.outputs.exists == 'true'
        run: |
          git config user.name "mobius-bot"
          git config user.email "mobius-bot@users.noreply.github.com"
          git add docs/divergence/data.json \
                  docs/divergence/dashboard.md \
                  docs/divergence/history/index.json \
                  docs/divergence/history/events.json \
                  docs/divergence/history/*.json \
                  docs/divergence/index.html \
                  docs/divergence/ui.js || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(dashboard): update divergence dashboard + history [skip ci]"
            git push
          fi
