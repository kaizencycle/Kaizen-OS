name: EPICON Guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  epicon:
    name: Intent Publication Gate
    runs-on: ubuntu-latest
    steps:
      # Required so ./.github/actions/epicon-guard resolves on disk.
      # Policy still loads from base SHA via policy-ref (not from checkout).
      - uses: actions/checkout@v4

      - uses: ./.github/actions/epicon-guard
        with:
          mode: enforce
          policy-ref: base
