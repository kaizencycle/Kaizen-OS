name: EPICON Guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  epicon:
    name: Intent Publication Gate
    runs-on: ubuntu-latest
    steps:
      # v1.1 policy-ref: base — hosted on Substrate until kaizencycle/epicon@v1.1 is tagged
      - uses: kaizencycle/Mobius-Substrate/.github/actions/epicon-guard@cursor/epicon-guard-rollout-substrate-7f49
        with:
          mode: enforce
          policy-ref: base
