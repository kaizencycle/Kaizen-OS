# MOBIUS-CLASS: canon-state-writer
# OWNER: @kaizencycle
# INTRODUCED: C-338
# LAST-REVIEWED: 2026-06-10
# STATUS: active
# PURPOSE: Layer 1 — deterministic daily cycle-state writer.
#
# Design rules (learned from the C-289 pipeline death and C-335/336/337):
#   1. DEPLOYMENT-DECOUPLED: commits carry [skip ci] and touch only state
#      paths, so Vercel/Render never build on a state write. This coupling
#      is what killed the last pipeline.
#   2. DETERMINISTIC: no LLM. Cycle number is arithmetic; ledger values are
#      fetched, never invented. If the ledger is unreachable, attested
#      fields are carried forward and marked unverified.
#   3. SCOPED IDENTITY (C-336): commits via the Mobius GitHub App, allowed
#      paths only (cycle.json, STATE/, journals/cycles/). Tier-3 protected
#      paths stay untouchable.
#   4. EPICON: intent trailer on every commit.

name: mobius-bot-state-sync

on:
  schedule:
    - cron: "10 4 * * *"   # 04:10 UTC — just after historical cycle rollover
  workflow_dispatch: {}     # manual catch-up runs

permissions:
  contents: write

concurrency:
  group: state-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mint scoped App token (C-336 identity)
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MOBIUS_BOT_APP_ID }}
          private-key: ${{ secrets.MOBIUS_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Compute cycle + fetch ledger state
        id: state
        env:
          LEDGER_BASE_URL: ${{ secrets.LEDGER_BASE_URL }}  # Civic-Protocol-Core on Render
        run: |
          python3 - << 'PY'
          import json, os, urllib.request, datetime

          # C-288 = 2026-04-21: the attested freeze point this sync corrects (see PR #298).
          ANCHOR_CYCLE = 288
          ANCHOR_DATE = datetime.date(2026, 4, 21)
          today = datetime.datetime.now(datetime.timezone.utc).date()
          cycle_n = ANCHOR_CYCLE + (today - ANCHOR_DATE).days
          cycle = f"C-{cycle_n}"

          ledger, verified = {}, False
          base = os.environ.get("LEDGER_BASE_URL", "").rstrip("/")
          if base:
              try:
                  with urllib.request.urlopen(f"{base}/pulse/state", timeout=15) as r:
                      ledger = json.load(r)
                      verified = True
              except Exception as e:
                  print(f"::warning::ledger unreachable, carrying forward: {e}")

          with open("cycle.json") as f:
              c = json.load(f)

          prev = c.get("current_cycle")
          c["current_cycle"] = cycle
          c["date"] = today.isoformat()
          c["last_updated"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          c["last_state_snapshot"] = cycle
          if verified and "gi" in ledger:
              c["gi"] = ledger["gi"]
              c["gi_attested_at"] = cycle
          note = (f"Auto-sync by mobius-bot (deterministic, no LLM). "
                  f"Advanced {prev} -> {cycle}. "
                  + ("GI refreshed from ledger." if verified and "gi" in ledger
                     else "Ledger unreachable or GI absent: attested fields carried forward UNVERIFIED."))
          c["notes"] = note

          with open("cycle.json", "w") as f:
              json.dump(c, f, indent=2); f.write("\n")
          with open("STATE/CYCLE.txt", "w") as f:
              f.write(cycle + "\n")

          os.makedirs("journals/cycles", exist_ok=True)
          stub = {
              "cycle": cycle, "date": today.isoformat(),
              "writer": "mobius-bot/state-sync",
              "ledger_verified": verified,
              "ledger_snapshot": ledger if verified else None,
              "narrative": None,  # Layer 3: ATLAS routine fills this, never the counters
          }
          p = f"journals/cycles/{cycle}.json"
          if not os.path.exists(p):           # idempotent: never overwrite a day
              with open(p, "w") as f:
                  json.dump(stub, f, indent=2); f.write("\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"cycle={cycle}\n")
          PY

      - name: Commit (deployment-decoupled, EPICON trailer)
        run: |
          git config user.name "mobius-bot[bot]"
          git config user.email "mobius-bot[bot]@users.noreply.github.com"
          git add cycle.json STATE/CYCLE.txt journals/cycles/
          git diff --cached --quiet && { echo "No drift — nothing to write."; exit 0; }
          git commit -m "canon: ${{ steps.state.outputs.cycle }} daily state sync [skip ci]" \
                     -m "EPICON-INTENT: scheduled deterministic cycle-state write; allowed paths only; no attested values invented." \
                     -m "Actor: mobius-bot (scoped App, C-336 guardrail model)"
          git push
