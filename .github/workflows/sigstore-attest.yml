# C-292: SUSPENDED — was signing a demo artifact ("Demo build artifact for Kaizen OS") with
# no push target. Cosign signs to Rekor but the artifact has no registry destination, making
# the attestation unverifiable and the step cosmetic. Remove or wire to a real artifact registry.

name: Sigstore Attestation (SUSPENDED C-292)

on:
  workflow_dispatch:    # manual only — push/PR triggers removed

permissions:
  contents: read
  id-token: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Sigstore attestation status
        run: |
          echo "::notice::sigstore-attest is suspended (C-292)."
          echo "This workflow was signing a demo artifact with no registry destination."
          echo "To re-enable: replace dist/demo.txt with a real build artifact and configure a registry push target."
          echo "See: https://docs.sigstore.dev/cosign/signing/signing_with_containers/"
