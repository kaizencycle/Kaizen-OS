# ## Authority Provenance
# C-358 corrective fix: remove dead external pulse default; snapshot-lite is
# GI/mode-only and must not feed coordination scores. Authority: @kaizencycle.
# See docs/templates/EPICON_FOUNDER_STANDING.md
#
# ═══════════════════════════════════════════════════════════════════════════════
# C-151 Sentinel Heartbeat Workflow
# ═══════════════════════════════════════════════════════════════════════════════
# C-303 fixes:
#   - Added preflight job: checks for calculate_coordination_score.js and
#     generate_pulse.js before launching the matrix. Was erroring every 6h.
#   - submit_attestation.ts guarded inline — skips with warning if absent.
#   - Sentinel matrix narrowed to ATLAS, AUREA, ECHO, EVE, HERMES (active).
# ═══════════════════════════════════════════════════════════════════════════════

name: Sentinel Heartbeat (C-151)

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours — 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:
    inputs:
      sentinel:
        description: 'Specific sentinel to attest (leave empty for all)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (no actual attestation)'
        required: false
        default: false
        type: boolean

env:
  LEDGER_RPC: ${{ secrets.LEDGER_RPC }}
  MIC_CONTRACT: ${{ vars.MIC_CONTRACT_ADDRESS }}
  # Optional override for a full pulse JSON (must include structure.{apps,packages,workflows}).
  # Unset → generate_pulse.js from checked-out repo (C-358: do not default to snapshot-lite).
  PULSE_URL: ${{ vars.PULSE_URL }}

permissions:
  contents: read
  id-token: write

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # PREFLIGHT — verify required scripts exist before launching matrix
  # ═══════════════════════════════════════════════════════════════════════════

  preflight:
    name: 🔍 Preflight Script Check
    runs-on: ubuntu-latest
    outputs:
      scripts_ready: ${{ steps.check.outputs.ready }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check required scripts
        id: check
        run: |
          MISSING=()

          [ -f "scripts/calculate_coordination_score.js" ] || MISSING+=("scripts/calculate_coordination_score.js")
          [ -f "scripts/generate_pulse.js" ] || MISSING+=("scripts/generate_pulse.js")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::warning::Sentinel Heartbeat skipped — missing scripts: ${MISSING[*]}"
            echo "::warning::Deploy these scripts to enable automated MIC attestation."
            echo "ready=false" >> $GITHUB_OUTPUT
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # FETCH PULSE DATA
  # ═══════════════════════════════════════════════════════════════════════════

  fetch-pulse:
    name: 📡 Fetch System Pulse
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.scripts_ready == 'true' && !inputs.dry_run
    outputs:
      pulse_data: ${{ steps.fetch.outputs.pulse }}
      cycle: ${{ steps.fetch.outputs.cycle }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch Pulse Data
        id: fetch
        run: |
          USE_REMOTE=false

          if [ -n "${PULSE_URL:-}" ]; then
            if curl -sf "$PULSE_URL" -o pulse-remote.json; then
              if jq -e '.structure | type == "object" and ((.apps != null) or (.packages != null) or (.workflows != null))' pulse-remote.json >/dev/null 2>&1; then
                mv pulse-remote.json pulse.json
                USE_REMOTE=true
                echo "✅ Fetched full pulse from $PULSE_URL"
              else
                echo "⚠️ $PULSE_URL lacks structure.{apps,packages,workflows} — not suitable for coordination scores"
              fi
            else
              echo "⚠️ Pulse API unavailable at $PULSE_URL"
            fi
          fi

          if [ "$USE_REMOTE" != "true" ]; then
            echo "📦 Generating pulse from repository state..."
            node scripts/generate_pulse.js > pulse.json
          fi

          CYCLE=$(jq -r '.cycle // "C-151"' pulse.json)
          echo "cycle=$CYCLE" >> $GITHUB_OUTPUT

          PULSE_B64=$(base64 -w 0 pulse.json)
          echo "pulse=$PULSE_B64" >> $GITHUB_OUTPUT

          echo "📊 Cycle: $CYCLE"
          echo "📊 MII: $(jq -r '.mii // .integrity.mii // "N/A"' pulse.json)"

  # ═══════════════════════════════════════════════════════════════════════════
  # SENTINEL ATTESTATION MATRIX
  # ═══════════════════════════════════════════════════════════════════════════

  attest:
    name: 🤖 Attest ${{ matrix.sentinel }}
    runs-on: ubuntu-latest
    needs: fetch-pulse
    if: ${{ !inputs.dry_run }}

    strategy:
      fail-fast: false
      matrix:
        sentinel: [ATLAS, AUREA, ECHO, EVE, HERMES]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Decode Pulse Data
        run: |
          echo "${{ needs.fetch-pulse.outputs.pulse_data }}" | base64 -d > pulse.json
          cat pulse.json | jq .

      - name: Calculate Coordination Score
        id: score
        run: |
          SCORE=$(node scripts/calculate_coordination_score.js ${{ matrix.sentinel }} pulse.json)
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "📊 ${{ matrix.sentinel }} Coordination Score: $SCORE"

      - name: Preview Reward
        id: preview
        run: |
          REWARD=$(node -e "
            const { estimateReward, SENTINEL_CATHEDRALS } = require('./packages/integrity-core/src/sentinel/mic.js');
            const score = ${{ steps.score.outputs.score }};
            const cathedral = SENTINEL_CATHEDRALS['${{ matrix.sentinel }}'] || 'FOR-PHILOSOPHERS';
            console.log(estimateReward(score, cathedral).toFixed(2));
          " 2>/dev/null || echo "N/A")
          echo "📈 Expected Reward: ~$REWARD MIC"

      - name: Submit Attestation
        if: ${{ !inputs.dry_run && env.LEDGER_RPC && env.MIC_CONTRACT }}
        env:
          SENTINEL_KEY: ${{ secrets[format('SENTINEL_KEY_{0}', matrix.sentinel)] }}
        run: |
          if [ ! -f "scripts/submit_attestation.ts" ]; then
            echo "::warning::scripts/submit_attestation.ts not found — skipping on-chain submission."
            exit 0
          fi
          npx tsx scripts/submit_attestation.ts \
            --sentinel ${{ matrix.sentinel }} \
            --score ${{ steps.score.outputs.score }} \
            --contract $MIC_CONTRACT \
            --rpc $LEDGER_RPC \
            --key "$SENTINEL_KEY"

      - name: Record Attestation
        if: always()
        run: |
          echo "## ${{ matrix.sentinel }} Heartbeat" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Cycle | ${{ needs.fetch-pulse.outputs.cycle }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Score | ${{ steps.score.outputs.score }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════════════
  # DRY RUN MODE
  # ═══════════════════════════════════════════════════════════════════════════

  dry-run:
    name: 🧪 Dry Run
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ inputs.dry_run && needs.preflight.outputs.scripts_ready == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Decode Pulse
        run: echo "${{ needs.fetch-pulse.outputs.pulse_data }}" | base64 -d > pulse.json || echo '{"cycle":"dry-run"}' > pulse.json

      - name: Calculate All Scores
        run: |
          echo "## C-151 Sentinel Heartbeat Dry Run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Sentinel | Score | Cathedral | Est. Reward |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|-----------|-------------|" >> $GITHUB_STEP_SUMMARY

          for SENTINEL in ATLAS AUREA ECHO EVE HERMES; do
            SCORE=$(node scripts/calculate_coordination_score.js $SENTINEL pulse.json 2>/dev/null || echo "0")
            echo "| $SENTINEL | $SCORE | - | ~${SCORE}00 MIC |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Dry run complete - no attestations submitted" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════════════
  # SKIPPED SUMMARY (scripts not ready)
  # ═══════════════════════════════════════════════════════════════════════════

  skipped:
    name: ⏸️ Heartbeat Skipped
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.scripts_ready == 'false'
    steps:
      - name: Log skip reason
        run: |
          echo "# ⏸️ Sentinel Heartbeat Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Required attestation scripts are not yet deployed." >> $GITHUB_STEP_SUMMARY
          echo "Deploy \`scripts/calculate_coordination_score.js\` and \`scripts/generate_pulse.js\` to enable." >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════════════
  # SUMMARY
  # ═══════════════════════════════════════════════════════════════════════════

  summary:
    name: 📋 Heartbeat Summary
    runs-on: ubuntu-latest
    needs: [preflight, fetch-pulse, attest]
    if: always() && !inputs.dry_run && needs.preflight.outputs.scripts_ready == 'true'

    steps:
      - name: Generate Summary
        run: |
          echo "# 🫀 C-151 Sentinel Heartbeat Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cycle:** ${{ needs.fetch-pulse.outputs.cycle }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All sentinel attestations have been processed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*\"We heal as we walk.\"* — Founder's Seal" >> $GITHUB_STEP_SUMMARY
