site_name: Mobius Substrate — Handbook
site_url: https://handbook.mobius-substrate.com
site_description: >
  The living handbook of Mobius Substrate: plain-language orientation, constitutional
  canon, cycle history, protocols, research, and civic infrastructure documentation.
site_author: Michael Judan (kaizencycle)

repo_name: kaizencycle/Mobius-Substrate
repo_url: https://github.com/kaizencycle/Mobius-Substrate
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Mobius Substrate — CC-BY-SA 4.0

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo/kaizen-logo.svg
  favicon: assets/logo/kaizen-favicon.svg
  language: en
  palette:
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Dark mode (Mobius Handbook)
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - search.preload
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - toc.integrate
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: kaizencycle
      repo: Mobius-Substrate
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      baselevel: 2
      toc_depth: 4

plugins:
  - search:
      lang: en
  - git-revision-date-localized:
      enable_creation_date: true
      type: datetime
      fallback_to_build_date: true
      enable_git_follow: false
      strict: false
  - minify:
      minify_html: true

extra_css:
  - assets/css/kaizen-theme.css
  - assets/css/handbook-terminal-theme.css
  - assets/css/mobius-proof.css
  - assets/css/handbook-ux.css
  - assets/css/c380-handbook.css
  - stylesheets/journal.css

extra_javascript:
  - assets/js/kaizen-enhancements.js
  - assets/js/mobius-handbook.js
  - assets/js/mobius-proof.js

extra:
  homepage: https://mobius-substrate.com
  canonical_domain: https://mobius-substrate.com
  terminal_url: https://terminal.mobius-substrate.com
  handbook_url: https://handbook.mobius-substrate.com
  current_cycle: C-381
  gi_status: yellow
  terminal_repo: https://github.com/kaizencycle/mobius-civic-ai-terminal
  substrate_repo: https://github.com/kaizencycle/Mobius-Substrate
  generator: false
  social:
    - icon: fontawesome/brands/github
      name: Mobius-Substrate on GitHub
      link: https://github.com/kaizencycle/Mobius-Substrate
    - icon: fontawesome/brands/github
      name: Terminal on GitHub
      link: https://github.com/kaizencycle/mobius-civic-ai-terminal
    - icon: material/heart-pulse
      name: Live Terminal
      link: https://terminal.mobius-substrate.com/
  announce: >-
    <strong>C-381:</strong> Handbook CI remediation for C-380 progressive disclosure.
    Begin with <a href="00-START-HERE/AI_SIMPLE_IN_LIFE/">AI Simple in Life</a>, then descend into canon and protocols.

# C-380: progressive disclosure. Plain language first; canonical depth remains intact.
