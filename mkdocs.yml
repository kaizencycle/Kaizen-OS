site_name: Mobius Handbook
site_url: https://kaizencycle.github.io/Mobius-Substrate/
site_description: "Mobius Substrate — public handbook with live Terminal proof. Civic intelligence, auditable signals."
site_author: Mobius Systems

# Repository
repo_name: kaizencycle/Mobius-Substrate
repo_url: https://github.com/kaizencycle/Mobius-Substrate
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2026 Mobius Systems — CC-BY-SA 4.0

# Theme: Material for MkDocs
theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo/kaizen-logo.svg
  favicon: assets/logo/kaizen-favicon.svg
  language: en
  palette:
    # Dark only — Terminal command surface (no light toggle)
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Dark mode (Mobius Handbook)

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - search.preload
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - toc.integrate
    - toc.follow

  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: kaizencycle
      repo: Mobius-Substrate
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      baselevel: 2
      toc_depth: 4

# Plugins
plugins:
  - search:
      lang: en
  - git-revision-date-localized:
      enable_creation_date: true
      type: datetime
      fallback_to_build_date: true
      enable_git_follow: false
      strict: false
  - minify:
      minify_html: true

# Extra CSS
extra_css:
  - assets/css/kaizen-theme.css
  - assets/css/handbook-terminal-theme.css
  - assets/css/mobius-proof.css
  - assets/css/handbook-ux.css

# Extra JavaScript
extra_javascript:
  - assets/js/kaizen-enhancements.js
  - assets/js/mobius-handbook.js
  - assets/js/mobius-proof.js

extra:
  homepage: https://mobius-civic-ai-terminal.vercel.app/
  terminal_url: https://mobius-civic-ai-terminal.vercel.app
  terminal_repo: https://github.com/kaizencycle/mobius-civic-ai-terminal
  substrate_repo: https://github.com/kaizencycle/Mobius-Substrate
  generator: false
  social:
    - icon: fontawesome/brands/github
      name: Mobius-Substrate on GitHub
      link: https://github.com/kaizencycle/Mobius-Substrate
    - icon: fontawesome/brands/github
      name: Terminal on GitHub
      link: https://github.com/kaizencycle/mobius-civic-ai-terminal
    - icon: material/heart-pulse
      name: Live Terminal
      link: https://mobius-civic-ai-terminal.vercel.app/
  announce: >-
    This handbook shows <strong>live proof</strong> from the Terminal when your browser can reach it (CORS).
    Start at <strong>Handbook hub</strong> or <strong>Public hub</strong> in the tabs above.

# Navigation — public-first, then depth, then archive
nav:
  - Home: INDEX.md
  - Handbook hub: 11-SUPPLEMENTARY/handbook/README.md
  - Public hub:
      - Start Here: 00-START-HERE/README.md
      - Live state (C-288): STATE_OF_THE_SUBSTRATE_C-288.md
      - Live state (C-284, archived): STATE_OF_THE_SUBSTRATE_C-284.md
      - Interactive library: 11-SUPPLEMENTARY/handbook/interactive-library.md
      - Proof tags (authoring): 11-SUPPLEMENTARY/handbook/proof-tags-authoring.md
  - Protocols:
      - Vault v1 (to Fountain): protocols/vault-to-fountain-protocol.md
      - Vault v2 (Sealed Reserve): protocols/vault-v2-sealed-reserve.md
      - Agent Reporting: protocols/agent-reporting-protocol.md
      - Personalized Tripwires: protocols/personalized-tripwires-protocol.md
  - Mesh (MNS · C-286):
      - mobius.yaml v1 (pulse + ingest): 09-MESH/MOBIUS_YAML_V1.md
      - OAA sovereign memory: 09-MESH/MNS_OAA_MEMORY.md
      - Mesh workflow v1 (HIVE): 09-MESH/MESH_WORKFLOW_V1.md
      - MNS Protocol v1: 09-MESH/MNS_PROTOCOL.md
      - MCP Bridge (mobius.yaml): 09-MESH/MNS_MCP_BRIDGE.md
      - Decentralization (Phase 1–2): 09-MESH/DECENTRALIZATION_PHASE1_2.md
      - KV storage tiers: 09-MESH/KV_STORAGE_TIERS.md
  - Architecture:
      - Overview: 04-TECHNICAL-ARCHITECTURE/overview/README.md
      - MIC (runtime issuance): 04-TECHNICAL-ARCHITECTURE/mic/README.md
      - MIC Issuance Protocol v1: 04-TECHNICAL-ARCHITECTURE/mic/mic_issuance_protocol.md
      - DVA Flows: 04-TECHNICAL-ARCHITECTURE/overview/DVA_FLOWS_OVERVIEW.md
      - MEMT Whitepaper: 04-TECHNICAL-ARCHITECTURE/memt/MEMT/MEMT_WHITEPAPER.md
      - Ledger GI Formula: 04-TECHNICAL-ARCHITECTURE/ledger/gi-formula.md
  - Governance:
      - Overview: 03-GOVERNANCE-AND-POLICY/governance/GOVERNANCE_OVERVIEW.md
      - Kintsugi Protocol: 03-GOVERNANCE-AND-POLICY/governance/kintsugi_protocol.md
      - Sentinel Constitution: 03-GOVERNANCE-AND-POLICY/governance/SENTINEL_CONSTITUTION.md
  - Research:
      - MII Spec: 04-TECHNICAL-ARCHITECTURE/substrate/mii-spec-v0.1.md
      - MFS Spec: 07-RESEARCH-AND-PUBLICATIONS/specs/MFS_SPEC_v1.md
      - Whitepapers: 07-RESEARCH-AND-PUBLICATIONS/whitepapers/MIC_Whitepaper_v2.1.md
  - Implementation:
      - Guides: 05-IMPLEMENTATION/guides/README.md
      - Deployment: 05-IMPLEMENTATION/guides/deployment/DEPLOYMENT_GUIDE.md
      - Onboarding: 05-IMPLEMENTATION/onboarding/README.md
  - EPICON:
      - Overview: epicon/README.md
      - EPICON-01: epicon/EPICON-01.md
      - EPICON-02: epicon/EPICON-02.md
      - EPICON-03: epicon/EPICON-03.md
  - Reference:
      - Master Index: 00-META/MASTER_INDEX.md
      - MIC runtime reference: 08-REFERENCE/mic_runtime_reference.md
      - Mobius SDK API (C-285 draft): specs/MOBIUS_SDK_API.md
      - Glossary: 00-START-HERE/GLOSSARY.md
      - FAQ: 00-START-HERE/FAQ.md
  - Archives:
      - Archives overview: 10-ARCHIVES/README.md
      - Archived handbooks: 10-ARCHIVES/handbook/README.md
      - Kaizen-OS handbook (2025): 10-ARCHIVES/handbook/kaizen-os-2025/index.md
      - Legacy index: 10-ARCHIVES/archive/README.md

# Validation - set to info to avoid breaking strict mode builds
validation:
  nav:
    not_found: warn
    absolute_links: info
  links:
    not_found: info
    absolute_links: info
